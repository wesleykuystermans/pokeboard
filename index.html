<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokéboard v0.8</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e9;color:#222;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:16px}
.panel{background:#fff;border:1px solid #ccc;border-radius:12px;padding:14px;margin:0 0 12px}.hidden{display:none}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.tile{min-height:76px;padding:7px;border:1px solid #bbb;border-radius:9px;background:#fafafa;text-align:left}.valid{outline:3px solid #1976d2}.gym{box-shadow:inset 0 0 0 2px #d59b00}
.pawn{display:inline-block;padding:3px 7px;margin:2px;border-radius:50%;background:#ddd;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap}
.cards{display:flex;gap:7px;overflow:auto;padding:3px}.card{min-width:125px;padding:9px;border:1px solid #bbb;border-radius:9px;background:#fff;text-align:left}.selected{outline:3px solid #1976d2}
button,select,input{font:inherit;padding:9px;border:1px solid #aaa;border-radius:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.small{font-size:12px;color:#666}.log{max-height:240px;overflow:auto;font-size:14px}
@media(max-width:650px){.board{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main>
<section id="setup" class="panel"><h2>Pokéboard v0.8</h2><p>Playtest met terreinbonus: vecht je met een Pokémon op een zone van zijn eigen type, dan krijgt hij ×2.</p>
<label>Aantal spelers <select id="count"><option>2</option><option>3</option><option>4</option></select></label><div id="players"></div><p><button id="start">Start spel</button></p></section>
<section id="game" class="hidden">
<div class="panel"><strong id="turn"></strong><div id="phase" class="small"></div><div id="stats"></div></div>
<div class="panel"><div class="actions"><button id="roll">🎲 Dobbel</button><button id="wild">⚔️ Wilde battle</button><button id="gym">🏅 Gym</button><button id="shop">🛒 Shop</button><button id="end">⏹ Beurt beëindigen</button></div><br><div id="board" class="board"></div></div>
<div class="panel"><strong>Hand</strong><div id="hand" class="cards"></div></div>
<div class="panel"><strong>Open Pokémon</strong><div class="small">Klik om te vangen als je op een overeenkomstige type-zone staat.</div><div id="market" class="cards"></div></div>
<div id="shopPanel" class="panel hidden"><strong>Poké Mart</strong><div class="actions"><button data-buy="Copper">Copper → Red Ball</button><button data-buy="Silver">Silver → Blue Ball</button><button data-buy="Gold">Gold → Yellow Ball</button></div></div>
<div class="panel"><strong>Spelverloop</strong><div id="log" class="log"></div></div>
</section>
</main>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const TYPES=["Normal","Fire","Water","Grass","Electric","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon"];
const GYMS=new Set([0,5,7,10,12,17]);
const RAW=[
["Caterpie",["Bug"],18],["Pidgey",["Normal","Flying"],24],["Rattata",["Normal"],25],["Zubat",["Poison","Flying"],27],["Geodude",["Rock","Ground"],31],["Oddish",["Grass","Poison"],32],["Poliwag",["Water"],30],["Vulpix",["Fire"],33],
["Pikachu",["Electric"],45],["Psyduck",["Water"],43],["Growlithe",["Fire"],48],["Cubone",["Ground"],44],["Drowzee",["Psychic"],46],["Onix",["Rock","Ground"],50],["Haunter",["Ghost","Poison"],55],["Machoke",["Fighting"],56],["Seel",["Water","Ice"],52],
["Charizard",["Fire","Flying"],88],["Blastoise",["Water"],88],["Venusaur",["Grass","Poison"],88],["Alakazam",["Psychic"],82],["Gengar",["Ghost","Poison"],84],["Dragonite",["Dragon","Flying"],96],["Lapras",["Water","Ice"],80]
];
const ADV={Fire:["Grass","Bug","Ice"],Water:["Fire","Rock","Ground"],Grass:["Water","Ground","Rock"],Electric:["Water","Flying"],Ice:["Grass","Ground","Flying","Dragon"],Fighting:["Normal","Rock","Ice"],Poison:["Grass","Bug"],Ground:["Fire","Electric","Poison","Rock"],Flying:["Grass","Fighting","Bug"],Psychic:["Fighting","Poison"],Bug:["Grass","Psychic","Poison"],Rock:["Fire","Ice","Flying","Bug"],Ghost:["Ghost","Psychic"],Dragon:["Dragon"],Normal:[]};
const POKE=RAW.map((x,i)=>({id:"p"+i,name:x[0],types:x[1],score:x[2],rarity:x[2]<=33?"Common":x[2]<=66?"Medium":"Rare",kind:"pokemon"}));
let S=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function card(name,kind,extra){return Object.assign({id:Math.random().toString(36).slice(2),name,kind},extra||{})}
const ball=n=>card(n,"ball"), coin=n=>card(n,"coin");
const current=()=>S.players[S.current];
function xy(i){return [Math.floor(i/6),i%6]} function distance(a,b){let A=xy(a),B=xy(b);return Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1])}
function hasPokemon(p){return p.hand.some(c=>c.kind==="pokemon")}
function canCatch(b,r){return b==="Yellow Ball"||(b==="Blue Ball"&&r!=="Rare")||(b==="Red Ball"&&r==="Common")}
function log(s){let d=document.createElement("div");d.textContent=s;$("#log").prepend(d)}
function setupRows(){let n=Number($("#count").value),box=$("#players");box.innerHTML="";for(let i=0;i<n;i++){let row=document.createElement("div");row.style.marginTop="8px";row.innerHTML='<input value="'+(i===0?"Wes":"Trainer "+(i+1))+'"> <select><option value="human">Mens</option><option value="ai" '+(i>0?"selected":"")+'>AI</option></select>';box.appendChild(row)}}
function drawToFive(p){while(p.hand.length<5){if(!p.deck.length){p.deck=shuffle(p.discard);p.discard=[]}if(!p.deck.length)break;p.hand.push(p.deck.pop())}}
function refill(){while(S.market.length<5&&S.wild.length)S.market.push(S.wild.pop())}
function start(){
 let defs=Array.from($("#players").children).map(r=>({name:r.querySelector("input").value.trim()||"Trainer",ai:r.querySelector("select").value==="ai"}));
 let board=shuffle(TYPES.flatMap(t=>[t,t,t])).slice(0,18), present=new Set(board);
 let wild=shuffle(POKE.filter(p=>p.types.some(t=>present.has(t))).flatMap(p=>Array.from({length:p.rarity==="Common"?3:p.rarity==="Medium"?2:1},()=>Object.assign({},p,{id:p.id+Math.random()}))));
 let starters=[["Bulbasaur",["Grass","Poison"]],["Charmander",["Fire"]],["Squirtle",["Water"]],["Pikachu",["Electric"]]];
 S={board,wild,market:[],players:defs.map((d,i)=>{let st=card(starters[i][0],"pokemon",{types:starters[i][1],score:30,rarity:"Common"});return Object.assign(d,{pos:[6,11,1,16][i],deck:shuffle([ball("Red Ball"),ball("Red Ball"),ball("Red Ball"),st]),discard:[],hand:[],badges:0})}),current:0,phase:"move",roll:0,selected:null,battled:false,captured:false};
 refill();$("#setup").classList.add("hidden");$("#game").classList.remove("hidden");$("#log").innerHTML="";begin();
}
function begin(){let p=current();S.phase="move";S.roll=0;S.selected=null;S.battled=false;S.captured=false;drawToFive(p);log("▶ "+p.name+(p.ai?" [AI]":"")+" begint.");render();if(p.ai)setTimeout(aiTurn,400)}
function typeMultiplier(a,b){let adv=a.types.some(t=>(ADV[t]||[]).some(x=>b.types.includes(x)));let disadv=b.types.some(t=>(ADV[t]||[]).some(x=>a.types.includes(x)));if(adv&&!disadv)return 2;if(disadv&&!adv)return .5;return 1}
function combatPower(pk,foe,playerPokemon){
 let terrain=playerPokemon&&pk.types.includes(S.board[current().pos])?2:1;
 let type=typeMultiplier(pk,foe);
 let mult;
 if(terrain===2||type===2) mult=2; else if(type===.5) mult=.5; else mult=1;
 return {value:Math.round(pk.score*mult),terrain,type,mult};
}
function chosenIndex(p){if(p===current()&&S.selected!==null&&p.hand[S.selected]&&p.hand[S.selected].kind==="pokemon")return S.selected;let best=-1,score=-1;p.hand.forEach((c,i)=>{if(c.kind==="pokemon"&&c.score>score){best=i;score=c.score}});return best}
function battle(gym,p){
 p=p||current();let pi=chosenIndex(p);if(pi<0)return false;let foe=S.wild.pop();if(!foe){log("Geen wilde Pokémon meer.");return false}
 let mine=p.hand.splice(pi,1)[0];p.discard.push(mine);S.selected=null;S.battled=true;
 let a=combatPower(mine,foe,true), f=combatPower(foe,mine,false), foePower=f.value*(gym?2:1);
 let reason=a.terrain===2?"zonebonus "+S.board[p.pos]+" ×2":a.type===2?"typevoordeel ×2":a.type===.5?"typenadeel ×½":"neutraal";
 log("⚔️ "+mine.name+": "+mine.score+" → "+a.value+" ("+reason+") vs "+foe.name+": "+foePower+(gym?" (Gym ×2)":"")+".");
 if(a.value>=foePower){if(gym){p.badges++;p.discard.push(card("Badge","badge"));log("🏅 "+p.name+" wint een Badge.")}else{let r=foe.rarity==="Common"?"Copper":foe.rarity==="Medium"?"Silver":"Gold";p.discard.push(coin(r));log("🏆 "+p.name+" wint een "+r+" Coin.")}}else log("💥 "+p.name+" verliest.");
 render();return true;
}
function capture(i,p){p=p||current();let pk=S.market[i];if(!pk||!pk.types.includes(S.board[p.pos]))return false;let bi=p.hand.findIndex(c=>c.kind==="ball"&&canCatch(c.name,pk.rarity));if(bi<0)return false;let used=p.hand.splice(bi,1)[0];p.discard.push(Object.assign({},pk,{id:"caught"+Math.random()}));S.market.splice(i,1);S.captured=true;refill();log("✨ "+p.name+" vangt "+pk.name+" met "+used.name+".");render();return true}
function buy(k,p){p=p||current();let i=p.hand.findIndex(c=>c.kind==="coin"&&c.name===k);if(i<0)return false;p.hand.splice(i,1);let b=k==="Copper"?"Red Ball":k==="Silver"?"Blue Ball":"Yellow Ball";p.discard.push(ball(b));log("🛒 "+p.name+" koopt "+b+".");render();return true}
function finish(){if(!S||!["action","shop"].includes(S.phase))return;let p=current();p.discard.push(...p.hand);p.hand=[];log("⏹ "+p.name+" beëindigt de beurt.");S.current=(S.current+1)%S.players.length;begin()}
function aiTurn(){
 if(!S||!current().ai)return;let p=current();S.roll=1+Math.floor(Math.random()*6);log("🎲 "+p.name+" [AI] gooit "+S.roll+".");
 let ds=S.board.map((_,i)=>i).filter(i=>distance(p.pos,i)>=1&&distance(p.pos,i)<=S.roll);
 function score(i){let z=S.board[i],s=Math.random();if(S.market.some(pk=>pk.types.includes(z)&&p.hand.some(c=>c.kind==="ball"&&canCatch(c.name,pk.rarity))))s+=10;if(GYMS.has(i)&&hasPokemon(p))s+=4;return s}
 ds.sort((a,b)=>score(b)-score(a));if(ds.length)p.pos=ds[0];S.phase="action";log("📍 "+p.name+" [AI] → "+S.board[p.pos]+".");
 let mi=S.market.findIndex(pk=>pk.types.includes(S.board[p.pos])&&p.hand.some(c=>c.kind==="ball"&&canCatch(c.name,pk.rarity)));if(mi>=0)capture(mi,p);
 if(hasPokemon(p))battle(GYMS.has(p.pos),p);for(let k of ["Gold","Silver","Copper"])while(buy(k,p)){}
 setTimeout(finish,500);
}
function render(){
 let p=current();$("#turn").textContent=p.name+(p.ai?" — AI":"")+" aan zet";$("#phase").textContent={move:"Dobbel om te bewegen.",destination:"Klik rechtstreeks op een geldige eindbestemming.",action:"Vang, battle, shop of beëindig je beurt.",shop:"Poké Mart."}[S.phase]||"";
 $("#stats").textContent=S.players.map(x=>x.name+" 🏅"+x.badges).join(" · ");
 let board=$("#board");board.innerHTML="";S.board.forEach((t,i)=>{let valid=!p.ai&&S.phase==="destination"&&distance(p.pos,i)>=1&&distance(p.pos,i)<=S.roll,b=document.createElement("button");b.type="button";b.className="tile "+(valid?"valid ":"")+(GYMS.has(i)?"gym":"");b.disabled=!valid;b.dataset.tile=i;b.innerHTML="<b>"+t+"</b><br>"+S.players.map((x,j)=>x.pos===i?'<span class="pawn">'+(j+1)+"</span>":"").join("");board.appendChild(b)});
 let hand=$("#hand");hand.innerHTML="";p.hand.forEach((c,i)=>{let b=document.createElement("button");b.type="button";b.className="card "+(S.selected===i?"selected":"");b.disabled=p.ai||c.kind!=="pokemon";b.dataset.hand=i;b.innerHTML="<b>"+c.name+"</b><br><span class=small>"+(c.kind==="pokemon"?c.types.join("/")+" · "+c.score+" · "+c.rarity:c.kind)+"</span>";hand.appendChild(b)});
 let market=$("#market");market.innerHTML="";S.market.forEach((pk,i)=>{let b=document.createElement("button");b.type="button";b.className="card";b.disabled=p.ai||S.phase!=="action"||S.captured;b.dataset.market=i;b.innerHTML="<b>"+pk.name+"</b><br><span class=small>"+pk.types.join("/")+" · "+pk.rarity+" · "+pk.score+"</span>";market.appendChild(b)});
 let human=!p.ai;$("#roll").disabled=!human||S.phase!=="move";$("#wild").disabled=!human||S.phase!=="action"||S.battled||!hasPokemon(p);$("#gym").disabled=!human||S.phase!=="action"||S.battled||!hasPokemon(p)||!GYMS.has(p.pos);$("#shop").disabled=!human||S.phase!=="action";$("#end").disabled=!human||!["action","shop"].includes(S.phase);$("#shopPanel").classList.toggle("hidden",S.phase!=="shop");
}
$("#count").addEventListener("change",setupRows);$("#start").addEventListener("click",start);
$("#roll").addEventListener("click",()=>{S.roll=1+Math.floor(Math.random()*6);S.phase="destination";log("🎲 "+current().name+" gooit "+S.roll+".");render()});
$("#board").addEventListener("click",e=>{let b=e.target.closest("[data-tile]");if(!b)return;let i=Number(b.dataset.tile);if(S.phase==="destination"&&distance(current().pos,i)>=1&&distance(current().pos,i)<=S.roll){current().pos=i;S.phase="action";log("📍 "+current().name+" → "+S.board[i]+".");render()}});
$("#hand").addEventListener("click",e=>{let b=e.target.closest("[data-hand]");if(b){S.selected=Number(b.dataset.hand);render()}});
$("#market").addEventListener("click",e=>{let b=e.target.closest("[data-market]");if(b)capture(Number(b.dataset.market))});
$("#wild").addEventListener("click",()=>battle(false));$("#gym").addEventListener("click",()=>battle(true));$("#shop").addEventListener("click",()=>{S.phase="shop";render()});$("#end").addEventListener("click",finish);
$("#shopPanel").addEventListener("click",e=>{let b=e.target.closest("[data-buy]");if(b)buy(b.dataset.buy)});
setupRows();
})();
</script></body></html>
